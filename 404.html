<style>
@font-face{font-family:'Press Start 2P';src:url(/assets/fonts/press-start-2p.woff2) format('woff2');font-display:swap;}
:root{--amber:#e8a13d;--navy:#1f3a5f;--paper:#f5f0e6;--px:'Press Start 2P',monospace;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:var(--navy);color:var(--paper);font:17px/1.6 var(--body);}
.px{font-family:var(--px);font-weight:400;line-height:1.5;text-transform:uppercase;}
.cab{width:100%;max-width:520px;background:var(--paper);border:4px solid var(--paper);padding:0 16px 16px;box-shadow:8px 8px 0 0 var(--amber);}
.mq{background:var(--amber);color:var(--navy);text-align:center;font-size:24px;line-height:1;padding:16px 0;margin:0 -16px 16px;border-bottom:4px solid var(--navy);}
.scr{display:grid;justify-items:center;gap:24px;text-align:center;background:var(--navy);border:4px solid var(--navy);box-shadow:inset 0 0 0 4px var(--amber);padding:32px 20px;}
.ko{width:128px;height:128px;shape-rendering:crispEdges;color:var(--paper);animation:shake .4s steps(2,end) 3;}
@keyframes shake{50%{transform:translateX(8px);}}
h1{font-size:16px;color:var(--amber);}
.cont{font-size:16px;display:flex;gap:16px;align-items:center;}
.cd{display:inline-block;width:1em;height:1.5em;overflow:hidden;vertical-align:top;}
.cd span{display:block;white-space:nowrap;animation:cd 10s steps(10,jump-none) 1 both;}
@keyframes cd{to{transform:translateX(-9em);}}
.btn{display:inline-block;font:400 16px/1.5 var(--px);text-transform:uppercase;text-decoration:none;background:var(--amber);color:var(--navy);border:4px solid var(--navy);padding:16px 24px;box-shadow:6px 6px 0 0 var(--paper);}
.btn:active{transform:translate(6px,6px);box-shadow:none;}
a{color:var(--amber);text-decoration-thickness:2px;text-underline-offset:4px;}
:focus-visible{outline:4px solid var(--amber);outline-offset:4px;}
.btn:focus-visible{outline-color:var(--paper);outline-offset:8px;}
@media (max-width:399px){.mq{font-size:16px;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
